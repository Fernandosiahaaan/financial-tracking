# Upstream definitions
upstream service_user {
    server service-user:8082;
}

upstream service_wallet {
    server service-wallet:8083;
}

upstream service_category {
    server service-category:8084;
}

upstream service_transaction {
    server service-transaction:8085;
}

server {
    listen 80;
    server_name _;

    # USER
    location ^~ /api/user/ {
        proxy_pass http://service_user/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # WALLET
    location ^~ /api/wallet/ {
        proxy_pass http://service_wallet/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # CATEGORY
    location ^~ /api/category/ {
        proxy_pass http://service_category/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # TRANSACTION
    location ^~ /api/transaction/ {
        proxy_pass http://service_transaction/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

}
